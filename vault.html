<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuza16 Game — Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .vault-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 0 24px;
      gap: 20px;
    }

    .pan-container {
      position: relative;
      width: 180px;
      height: 160px;
      margin: 0 auto;
    }

    .pan-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18));
    }

    .egg-left, .egg-right {
      position: absolute;
      font-size: 58px;
      top: 10px;
      transition: transform 0.5s ease, opacity 0.4s ease;
    }
    .egg-left  { left: 10px; transform: rotate(0deg) translateY(0); }
    .egg-right { right: 10px; transform: rotate(0deg) translateY(0); }

    .pan-container.cracking .egg-left  { transform: rotate(-25deg) translateY(18px); }
    .pan-container.cracking .egg-right { transform: rotate(25deg) translateY(18px); }

    .pan-container.cracked .egg-left,
    .pan-container.cracked .egg-right {
      opacity: 0;
      transform: scale(0.2) translateY(60px);
    }

    .yolk-reveal {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) scale(0.3);
      font-size: 60px;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }
    .yolk-reveal.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .vault-countdown {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--sage);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <div class="score-header">
      <div class="score-block">
        <div class="score-label">Total Portofel</div>
        <div class="score-value" id="total-wallet">— <span class="score-unit">pct</span></div>
      </div>
      <div class="score-block">
        <div class="score-label">Scor Săptămânal</div>
        <div class="score-value" id="weekly-score">— <span class="score-unit">pct</span></div>
      </div>
    </div>

    <main class="page-content" id="main-content">
      <div class="loading-spinner" id="loading-state">
        <p>Se verifică Vault-ul...</p>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="game.html"        class="nav-item">🎮<span>Joacă</span></a>
      <a href="vault.html"       class="nav-item active">🔐<span>Vault</span></a>
      <a href="leaderboard.html" class="nav-item">🏆<span>Clasament</span></a>
      <a href="shop.html"        class="nav-item">🛍️<span>Magazin</span></a>
    </nav>

  </div>

  <script type="module" src="vault.js"></script>
</body>
</html>
