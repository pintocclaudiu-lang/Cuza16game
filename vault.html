<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuza16 Game — Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Animație ouă în tigaie ──────────────────────────────────── */
    .vault-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 0 24px;
      gap: 20px;
    }

    .pan-container {
      position: relative;
      width: 180px;
      height: 160px;
      margin: 0 auto;
    }

    .pan-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18));
    }

    /* Ouăle întregi — stau deasupra tigăii */
    .egg-left, .egg-right {
      position: absolute;
      font-size: 58px;
      top: 10px;
      transition: transform 0.5s ease, opacity 0.4s ease;
    }
    .egg-left  { left: 10px; transform: rotate(0deg) translateY(0); }
    .egg-right { right: 10px; transform: rotate(0deg) translateY(0); }

    /* Faza 1: ouăle se înclină — „se sparg" */
    .pan-container.cracking .egg-left  {
      transform: rotate(-25deg) translateY(18px);
    }
    .pan-container.cracking .egg-right {
      transform: rotate(25deg) translateY(18px);
    }

    /* Faza 2: ouăle dispar — s-au spart în tigaie */
    .pan-container.cracked .egg-left,
    .pan-container.cracked .egg-right {
      opacity: 0;
      transform: scale(0.2) translateY(60px);
    }

    /* Gălbenușurile — apar în tigaie după ce ouăle se sparg */
    .yolk-reveal {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) scale(0.3);
      font-size: 60px;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }
    .yolk-reveal.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* ── Vault text states ───────────────────────────────────────── */
    .vault-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700;
      color: var(--charcoal); text-align: center;
      margin: 0;
    }
    .vault-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14px; color: var(--sage);
      text-align: center; margin: 0;
      line-height: 1.5;
    }
    .vault-prize-box {
      background: var(--sand);
      border-radius: 16px;
      padding: 20px 24px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .vault-prize-emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
    }
    .vault-prize-label {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 700;
      color: var(--charcoal);
    }
    .vault-prize-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: var(--sage);
      margin-top: 6px;
    }
    .vault-code-box {
      font-family: 'Inter', sans-serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 3px;
      background: var(--charcoal); color: #fff;
      border-radius: 10px; padding: 12px 20px;
      margin-top: 12px; display: inline-block;
    }

    /* ── Locked / already opened ─────────────────────────────────── */
    .vault-locked-wrap {
      text-align: center; padding: 24px 0;
    }
    .vault-locked-icon { font-size: 64px; }

    /* ── Countdown ───────────────────────────────────────────────── */
    .vault-countdown {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: var(--sage);
      text-align: center; margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="score-header">
    <div class="score-block">
      <span class="score-label">Total Portofel</span>
      <span class="score-value" id="total-wallet">—</span>
    </div>
    <div class="score-center">
      <img src="logo.png" alt="Cuza16" class="header-logo" onerror="this.style.display='none'">
    </div>
    <div class="score-block">
      <span class="score-label">Scor Săptămânal</span>
      <span class="score-value" id="weekly-score">—</span>
    </div>
  </header>

  <main class="page-content" id="main-content">
    <div class="loading-spinner" id="loading-state">
      <div class="spinner"></div>
      <p>Se verifică Vault-ul...</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="game.html"        class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Joacă</span></a>
    <a href="vault.html"       class="nav-item active"><span class="nav-icon">🔐</span><span class="nav-label">Vault</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="nav-icon">🏆</span><span class="nav-label">Clasament</span></a>
    <a href="shop.html"        class="nav-item"><span class="nav-icon">🛍️</span><span class="nav-label">Magazin</span></a>
  </nav>

  <script type="module" src="vault.js"></script>
</body>
</html>
