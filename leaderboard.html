<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuza16 Game — Clasament</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .leaderboard-header-card {
      text-align: center;
      padding: 20px 20px 16px;
    }
    .leaderboard-header-card h1 {
      margin: 4px 0 0;
    }
    .week-label {
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: var(--sage);
      letter-spacing: 1px; text-transform: uppercase;
      margin-top: 4px;
    }
    .rank-list {
      display: flex; flex-direction: column;
      gap: 8px; padding: 0 16px 16px;
    }
    .rank-row {
      display: flex; align-items: center;
      gap: 12px; padding: 12px 14px;
      background: var(--cream);
      border: 1.5px solid var(--sand);
      border-radius: 12px;
    }
    .rank-row-self {
      border-color: var(--gold);
      background: #FBF5E8;
    }
    .rank-number {
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 700;
      color: var(--sage); min-width: 28px;
      text-align: center;
    }
    .rank-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .rank-name {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600;
      color: var(--charcoal);
    }
    .rank-points {
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }
    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--sage); font-size: 14px;
    }
    .empty-state .big-emoji { font-size: 48px; margin-bottom: 12px; }
    .loading-spinner {
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      padding: 40px 0;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--sand);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--sage); padding: 12px 16px 6px;
    }
  </style>
</head>
<body>
  <header class="score-header">
    <div class="score-block">
      <span class="score-label">Total Portofel</span>
      <span class="score-value" id="total-wallet">—</span>
    </div>
    <div class="score-center">
      <img src="logo.png" alt="Cuza16" class="header-logo" onerror="this.style.display='none'">
    </div>
    <div class="score-block">
      <span class="score-label">Scor Săptămânal</span>
      <span class="score-value" id="weekly-score">—</span>
    </div>
  </header>

  <main class="page-content">
    <div class="leaderboard-header-card card">
      <p class="eyebrow">Săptămâna curentă</p>
      <h1>🏆 Clasament</h1>
      <p class="week-label" id="week-label">Se încarcă...</p>
    </div>

    <div id="loading-state" class="loading-spinner">
      <div class="spinner"></div>
      <p style="font-size:13px;color:var(--sage);">Se încarcă clasamentul...</p>
    </div>

    <div class="section-label" id="top-label" style="display:none;">Top jucători</div>
    <div class="rank-list" id="rank-list" style="display:none;"></div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="big-emoji">🥚</div>
      <p>Niciun jucător cu puncte această săptămână.<br>Fii primul!</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="game.html"        class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Joacă</span></a>
    <a href="vault.html"       class="nav-item"><span class="nav-icon">🔐</span><span class="nav-label">Vault</span></a>
    <a href="leaderboard.html" class="nav-item active"><span class="nav-icon">🏆</span><span class="nav-label">Clasament</span></a>
    <a href="shop.html"        class="nav-item"><span class="nav-icon">🛍️</span><span class="nav-label">Magazin</span></a>
  </nav>

  <script type="module" src="leaderboard.js"></script>
</body>
</html>
