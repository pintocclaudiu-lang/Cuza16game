<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuza16 Game — Magazin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px 16px;
    }
    .shop-item {
      background: var(--cream);
      border: 1.5px solid var(--sand);
      border-radius: 14px;
      padding: 16px 12px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer;
      transition: border-color 0.18s, transform 0.12s;
      position: relative;
    }
    .shop-item:hover { border-color: var(--gold); transform: translateY(-2px); }
    .shop-item:active { transform: scale(0.97); }
    .shop-item.disabled {
      opacity: 0.45; cursor: not-allowed;
      transform: none;
    }
    .shop-item-emoji { font-size: 38px; }
    .shop-item-name {
      font-family: 'Playfair Display', serif;
      font-size: 13px; font-weight: 600;
      color: var(--charcoal); text-align: center;
      line-height: 1.3;
    }
    .shop-item-desc {
      font-family: 'Inter', sans-serif;
      font-size: 11px; color: var(--sage);
      text-align: center; line-height: 1.4;
    }
    .shop-item-price {
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--gold);
      background: #FBF5E8;
      border-radius: 20px; padding: 4px 12px;
    }
    .shop-item-badge {
      position: absolute; top: 8px; right: 8px;
      background: var(--gold); color: #fff;
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      border-radius: 6px; padding: 2px 6px;
    }

    /* Modal confirmare */
    .modal-confirm {
      padding: 24px 20px;
    }
    .modal-confirm-emoji { font-size: 52px; text-align: center; display: block; margin-bottom: 12px; }
    .modal-confirm h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px; text-align: center; margin: 0 0 8px;
    }
    .modal-confirm p {
      font-size: 14px; color: var(--sage); text-align: center;
      line-height: 1.5; margin: 0 0 20px;
    }
    .modal-confirm .modal-actions {
      display: flex; gap: 10px;
    }
    .modal-confirm .modal-actions .btn {
      flex: 1;
    }
    .modal-success { text-align: center; padding: 28px 20px; }
    .modal-success .success-emoji { font-size: 56px; margin-bottom: 12px; }
    .modal-success h2 { font-size: 20px; margin: 0 0 8px; }
    .modal-success .redemption-code {
      font-family: 'Inter', sans-serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 3px;
      background: var(--charcoal); color: #fff;
      border-radius: 10px; padding: 12px 20px;
      margin: 12px 0; display: inline-block;
    }
    .modal-success p {
      font-size: 13px; color: var(--sage); line-height: 1.5;
    }

    /* Wallet bar */
    .wallet-bar {
      margin: 0 16px 12px;
      background: var(--sand); border-radius: 12px;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .wallet-bar-label { font-size: 12px; color: var(--sage); font-family: 'Inter', sans-serif; }
    .wallet-bar-val   { font-size: 20px; font-weight: 700; color: var(--gold); font-family: 'Playfair Display', serif; }

    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--sage); padding: 12px 16px 6px;
    }
  </style>
</head>
<body>
  <header class="score-header">
    <div class="score-block">
      <span class="score-label">Total Portofel</span>
      <span class="score-value" id="total-wallet">—</span>
    </div>
    <div class="score-center">
      <img src="logo.png" alt="Cuza16" class="header-logo" onerror="this.style.display='none'">
    </div>
    <div class="score-block">
      <span class="score-label">Scor Săptămânal</span>
      <span class="score-value" id="weekly-score">—</span>
    </div>
  </header>

  <main class="page-content">
    <div class="card" style="padding:16px 20px 14px;">
      <p class="eyebrow">Recompense Cuza16</p>
      <h1>Magazin</h1>
      <p class="subtitle">Folosește punctele din portofel pentru a obține recompense reale la bistro.</p>
    </div>

    <div id="loading-state" style="text-align:center;padding:32px;color:var(--sage);font-size:14px;">
      <div class="spinner" style="margin:0 auto 12px;width:32px;height:32px;border:3px solid var(--sand);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      Se încarcă...
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <div id="shop-content" style="display:none;">
      <div class="wallet-bar">
        <span class="wallet-bar-label">Punctele tale disponibile</span>
        <span class="wallet-bar-val" id="wallet-display">0 pct</span>
      </div>
      <div class="section-label">Recompense disponibile</div>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <nav class="bottom-nav">
    <a href="game.html"        class="nav-item"><span class="nav-icon">🎮</span><span class="nav-label">Joacă</span></a>
    <a href="vault.html"       class="nav-item"><span class="nav-icon">🔐</span><span class="nav-label">Vault</span></a>
    <a href="leaderboard.html" class="nav-item"><span class="nav-icon">🏆</span><span class="nav-label">Clasament</span></a>
    <a href="shop.html"        class="nav-item active"><span class="nav-icon">🛍️</span><span class="nav-label">Magazin</span></a>
  </nav>

  <script type="module" src="shop.js"></script>
</body>
</html>
